<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatentRAG - Search Report</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f5f8;
            --panel: #f0f0f5;
            --panel-border: #cac4d0;
            --surface: #ffffff;
            --surface-border: #d7d7dc;
            --text: #1d1d22;
            --muted: #8d8d96;
            --muted-strong: #6f7078;
            --accent: #111114;
            --accent-soft: #ededf0;
            --success: #217a3b;
            --success-bg: #e7f7ec;
            --warning: #9a5b00;
            --warning-bg: #fff2ce;
            --danger: #b12a3c;
            --danger-bg: #ffe7eb;
            --info: #315fbd;
            --info-bg: #eaf1ff;
            --shadow: 0 22px 60px rgba(20, 20, 35, 0.10);
            --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        * {
            margin: 0;
        }

        body {
            min-height: 100vh;
            background: #f1f1f1;
            color: var(--text);
            font-family: var(--font);
            line-height: 1.5;
        }

        button {
            font: inherit;
            border: 0;
        }

        .report-page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 333px minmax(0, 1fr);
            background: #f1f1f1;
            color: #111111;
        }

        .report-sidebar {
            min-height: 100vh;
            padding: 33px 16px;
            background: #ffffff;
            border-right: 1px solid #d4d4d4;
        }

        .report-brand {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
            font-size: 1rem;
            font-weight: 760;
        }

        .brand-mark {
            width: 24px;
            height: 24px;
            color: #6a4bb3;
        }

        .report-status {
            margin-bottom: 10px;
            color: #777777;
            font-size: 0.92rem;
            font-weight: 760;
        }

        .progress-list {
            display: grid;
            gap: 13px;
            list-style: none;
            padding: 0;
        }

        .progress-step {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1f1f1f;
            font-size: 1rem;
            line-height: 1.45;
        }

        .progress-dot {
            width: 8px;
            height: 8px;
            flex: 0 0 auto;
            border-radius: 999px;
            background: #d7d7d7;
            opacity: 0;
        }

        .progress-step.active .progress-dot {
            background: #6a4bb3;
            opacity: 1;
        }

        .progress-step.done .progress-dot {
            background: #111111;
            opacity: 1;
        }

        .sidebar-actions {
            margin-top: 28px;
        }

        .text-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 10px;
            border-radius: 8px;
            background: #f4f4f4;
            color: #1f1f1f;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .text-btn:hover,
        .text-btn:focus-visible {
            background: #e9e9e9;
            outline: none;
        }

        .report-main {
            min-width: 0;
            padding: 0 16px 58px 32px;
        }

        .report-title-band {
            min-height: 71px;
            display: flex;
            align-items: center;
            margin-bottom: 87px;
            padding: 18px 0 18px 0;
            background: #ffffff;
        }

        .report-title-band h2 {
            font-size: 1.52rem;
            font-weight: 790;
            line-height: 1.1;
        }

        .report-content {
            display: grid;
            gap: 66px;
            max-width: 880px;
        }

        .report-block {
            padding: 10px 10px 12px;
            background: #ffffff;
        }

        .report-block h3 {
            margin-bottom: 25px;
            font-size: 1.55rem;
            font-weight: 790;
            line-height: 1.1;
        }

        .report-block h4 {
            margin-bottom: 2px;
            font-size: 1.48rem;
            font-weight: 790;
            line-height: 1.18;
        }

        .report-block p,
        .report-block li {
            color: #111111;
            font-size: 0.95rem;
            line-height: 1.38;
        }

        .report-block ul {
            display: grid;
            gap: 5px;
            padding-left: 20px;
        }

        .report-meta {
            margin-top: 8px;
            color: #555555;
            font-size: 0.86rem;
            font-weight: 700;
        }

        .report-loading {
            color: #4f4f4f;
            font-size: 1rem;
            font-weight: 650;
        }

        .report-error {
            color: var(--danger);
        }

        .similarity-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 68px;
            padding: 7px 10px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 800;
        }

        .similarity-high {
            background: var(--success-bg);
            color: var(--success);
        }

        .similarity-medium {
            background: var(--warning-bg);
            color: var(--warning);
        }

        .similarity-low {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .empty-state {
            padding: 34px 20px;
            color: var(--muted-strong);
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 820px) {
            .report-page {
                grid-template-columns: 1fr;
            }

            .report-sidebar {
                min-height: auto;
                border-right: 0;
                border-bottom: 1px solid #d4d4d4;
            }

            .report-main {
                padding: 0 14px 40px;
            }

            .report-title-band {
                margin-bottom: 38px;
                padding-left: 0;
            }

            .report-content {
                max-width: none;
                gap: 38px;
            }
        }

        @media (max-width: 520px) {
            .report-sidebar {
                padding: 24px 14px;
            }

            .progress-step {
                font-size: 0.94rem;
            }

            .report-block h3,
            .report-block h4 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="report-page" aria-labelledby="reportTitle">
            <aside class="report-sidebar">
                <div class="report-brand">
                    <svg class="brand-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 2.25 14.43 4.7l3.43-.49 1.1 3.28 3.04 1.67-1.54 3.09 1.54 3.09-3.04 1.67-1.1 3.28-3.43-.49L12 21.75 9.57 19.3l-3.43.49-1.1-3.28L2 14.84l1.54-3.09L2 8.66l3.04-1.67 1.1-3.28 3.43.49L12 2.25Z"></path>
                    </svg>
                    <span>Novelty Search</span>
                </div>
                <div class="report-status">{{ reportStatus }}</div>
                <ol class="progress-list" aria-label="Report generation progress">
                    <li class="progress-step" :class="stepClass(0)"><span class="progress-dot"></span><span>Step 1: finding reference patents</span></li>
                    <li class="progress-step" :class="stepClass(1)"><span class="progress-dot"></span><span>Step 2: AI matching patents</span></li>
                    <li class="progress-step" :class="stepClass(2)"><span class="progress-dot"></span><span>Step 3: analysing novelty</span></li>
                    <li class="progress-step" :class="stepClass(3)"><span class="progress-dot"></span><span>Step 4: preparing result documents</span></li>
                </ol>
                <div class="sidebar-actions">
                    <button class="text-btn" v-if="showNewSearch" type="button" @click="goToSearch">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" aria-hidden="true">
                            <path d="M19 12H5"></path>
                            <path d="m12 19-7-7 7-7"></path>
                        </svg>
                        New search
                    </button>
                </div>
            </aside>

            <div class="report-main">
                <div class="report-title-band">
                    <h2 id="reportTitle">Search Report</h2>
                </div>
                <div class="report-content" v-html="reportContent"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const reportStatus = ref('Searching...');
                const reportContent = ref('');
                const showNewSearch = ref(false);
                const activeStep = ref(0);
                const progressTimer = ref(null);
                const pollTimer = ref(null);
                const currentJobId = ref(null);

                const progressSteps = [
                    'Step 1: finding reference patents',
                    'Step 2: AI matching patents',
                    'Step 3: analysing novelty',
                    'Step 4: preparing result documents'
                ];

                function stepClass(index) {
                    return {
                        'done': index < activeStep.value,
                        'active': index === activeStep.value
                    };
                }

                function setProgressStep(activeIndex) {
                    activeStep.value = activeIndex;
                }

                function startProgress() {
                    clearInterval(progressTimer.value);
                    let index = 0;
                    progressTimer.value = setInterval(() => {
                        index = Math.min(index + 1, progressSteps.length - 1);
                        setProgressStep(index);
                        if (index === progressSteps.length - 1) {
                            clearInterval(progressTimer.value);
                        }
                    }, 900);
                }

                function completeProgress() {
                    clearInterval(progressTimer.value);
                    activeStep.value = progressSteps.length;
                    reportStatus.value = 'Report ready';
                    showNewSearch.value = true;
                }

                function showReportShell() {
                    reportStatus.value = 'Searching...';
                    reportContent.value = `
                        <section class="report-block">
                            <p class="report-loading">Preparing report...</p>
                        </section>
                    `;
                    showNewSearch.value = false;
                    setProgressStep(0);
                    startProgress();
                }

                function escapeHtml(value) {
                    const div = document.createElement('div');
                    div.textContent = value;
                    return div.innerHTML;
                }

                function formatSimilarityText(score) {
                    const normalizedScore = Number.isFinite(score) ? score : 0;
                    const percent = normalizedScore <= 1 ? normalizedScore * 100 : normalizedScore;
                    return `${percent.toFixed(1)}%`;
                }

                function formatSimilarity(score) {
                    const normalizedScore = Number.isFinite(score) ? score : 0;
                    const percent = normalizedScore <= 1 ? normalizedScore * 100 : normalizedScore;
                    const cssClass = percent >= 70 ? 'similarity-high' : percent >= 40 ? 'similarity-medium' : 'similarity-low';
                    return `<span class="similarity-badge ${cssClass}">${percent.toFixed(1)}%</span>`;
                }

                function extractResults(data) {
                    let results = [];
                    if (Array.isArray(data)) {
                        results = data;
                    } else if (Array.isArray(data.results)) {
                        results = data.results;
                    } else if (Array.isArray(data.data)) {
                        results = data.data;
                    } else if (Array.isArray(data.documents)) {
                        results = data.documents;
                    }
                    return results;
                }

                function getDocField(doc, fields, fallback = '') {
                    for (const field of fields) {
                        if (doc[field] !== undefined && doc[field] !== null && String(doc[field]).trim()) {
                            return doc[field];
                        }
                    }
                    return fallback;
                }

                function getSimilarity(doc) {
                    const value = doc.similarity !== undefined ? doc.similarity :
                        doc.score !== undefined ? doc.score :
                        doc.relevance !== undefined ? doc.relevance : 0;
                    const number = Number(value);
                    return Number.isFinite(number) ? number : 0;
                }

                function sentenceList(text, fallbackItems, limit = 3) {
                    const cleanText = String(text || '').replace(/\s+/g, ' ').trim();
                    if (!cleanText) {
                        return fallbackItems;
                    }

                    const sentences = cleanText
                        .split(/(?<=[.!?])\s+/)
                        .map((sentence) => sentence.trim())
                        .filter(Boolean)
                        .slice(0, limit);

                    return sentences.length ? sentences : fallbackItems;
                }

                function toggleContext() {
                    const el = document.getElementById('contextContent');
                    const btn = document.getElementById('contextToggleBtn');
                    if (!el) return;
                    const hidden = el.classList.toggle('hidden');
                    btn.textContent = hidden ? 'Show retrieved context' : 'Hide retrieved context';
                }

                // Expose toggleContext globally so it can be called from v-html rendered onclick
                window.toggleContext = toggleContext;

                function renderReport(data) {
                    const results = extractResults(data);
                    completeProgress();

                    if (!results.length) {
                        const answer = data && data.answer ? `<p>${escapeHtml(data.answer)}</p>` : '';
                        reportContent.value = `
                            <section class="report-block">
                                <h3>No reference patents found</h3>
                                <h4>Novelty Found</h4>
                                ${answer || '<p>No matching prior art documents were returned for this technical solution.</p>'}
                            </section>
                        `;
                        return;
                    }

                    const topResults = results.slice(0, 2);
                    const featureBlocks = topResults.map((doc, index) => {
                        const id = getDocField(doc, ['patent_id', 'id', 'patentId', 'document_id'], 'Reference patent');
                        const title = getDocField(doc, ['title', 'name', 'patent_title'], `Reference Patent ${index + 1}`);
                        const snippet = getDocField(doc, ['snippet', 'text', 'abstract', 'description'], '');
                        const similarity = getSimilarity(doc);
                        const fallbackItems = [
                            `Reference patent: ${String(id)}`,
                            `Similarity score: ${formatSimilarityText(similarity)}`,
                            'Key comparison sentences were returned by the patent knowledge graph.'
                        ];
                        const bullets = sentenceList(snippet, fallbackItems, 3)
                            .map((item) => `<li>${escapeHtml(item)}</li>`)
                            .join('');

                        return `
                            <section class="report-block">
                                <h3>Feature ${index + 1}: ${escapeHtml(String(title).slice(0, 52))}</h3>
                                <h4>Reference patents comparison</h4>
                                <ul>${bullets}</ul>
                                <p class="report-meta">Patent ${escapeHtml(String(id))} · ${formatSimilarityText(similarity)} match</p>
                            </section>
                        `;
                    }).join('');

                    const novelItems = [
                        `${results.length} reference patent${results.length === 1 ? '' : 's'} matched the submitted solution.`,
                        data && data.answer ? data.answer : 'Review the highlighted comparison sentences to decide which features remain novel.',
                        'Highest-similarity references are listed first for examiner-style review.'
                    ];

                    // Build context section if contexts are available
                    const contexts = data && data.contexts ? data.contexts : '';
                    const contextSection = contexts ? `
                        <section class="report-block">
                            <h3>Retrieved Context</h3>
                            <h4>Patent text segments matched by the knowledge graph</h4>
                            <button class="text-btn" id="contextToggleBtn" onclick="toggleContext()" style="margin-bottom:12px">Show retrieved context</button>
                            <div id="contextContent" class="hidden" style="max-height:400px;overflow-y:auto;padding:12px;background:#f8f8f9;border-radius:8px;font-size:0.85rem;line-height:1.45;white-space:pre-wrap;word-break:break-word;">${escapeHtml(contexts)}</div>
                        </section>
                    ` : '';

                    reportContent.value = `
                        ${featureBlocks}
                        ${contextSection}
                        <section class="report-block">
                            <h3>Novelty Found / No Novelty Found</h3>
                            <h4>List features that are novel</h4>
                            <ul>${novelItems.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul>
                        </section>
                    `;
                }

                function renderReportError(error) {
                    clearInterval(progressTimer.value);
                    setProgressStep(0);
                    reportStatus.value = 'Search failed';
                    showNewSearch.value = true;
                    reportContent.value = `
                        <section class="report-block">
                            <h3>Search Report</h3>
                            <h4 class="report-error">Unable to generate report</h4>
                            <p>${escapeHtml(error.message)}</p>
                        </section>
                    `;
                }

                function renderReportPreview() {
                    showReportShell();
                    renderReport({
                        answer: 'Potential novelty remains in the adaptive control logic and the way occupancy predictions are used to reduce energy consumption while maintaining occupant comfort.',
                        results: [
                            {
                                patent_id: 'US-REF-001',
                                title: 'Smart building energy management system',
                                similarity: 0.87,
                                snippet: 'A building management system receives occupancy sensor data and controls lighting and HVAC equipment. The reference describes automated low-power modes for unoccupied rooms. It does not emphasize predictive room usage modelling across multiple sensor types.'
                            },
                            {
                                patent_id: 'US-REF-002',
                                title: 'Occupancy based environmental controller',
                                similarity: 0.72,
                                snippet: 'The controller changes heating, ventilation, and lighting settings based on detected occupancy. The patent focuses on immediate sensor readings rather than machine learning forecasts of future occupancy patterns.'
                            }
                        ]
                    });
                }

                function pollResult(jobId, onComplete, onError) {
                    currentJobId.value = jobId;
                    let attempts = 0;
                    const maxAttempts = 180; // 180 * 2s = 6 minutes max

                    pollTimer.value = setInterval(async () => {
                        attempts++;
                        try {
                            const resp = await fetch(`/api/result/${jobId}`);
                            if (!resp.ok) {
                                if (resp.status === 404) {
                                    onError(new Error('Job not found'));
                                    clearInterval(pollTimer.value);
                                    return;
                                }
                                throw new Error(`Poll returned ${resp.status}`);
                            }

                            const data = await resp.json();

                            if (data.status === 'complete') {
                                clearInterval(pollTimer.value);
                                onComplete(data.data);
                            } else if (data.status === 'failed') {
                                clearInterval(pollTimer.value);
                                onError(new Error(data.error || 'Query processing failed'));
                            }
                            // status === 'pending' → keep polling

                            if (attempts >= maxAttempts) {
                                clearInterval(pollTimer.value);
                                onError(new Error('Query timed out after 6 minutes'));
                            }
                        } catch (error) {
                            clearInterval(pollTimer.value);
                            onError(error);
                        }
                    }, 2000);
                }

                function cancelPolling() {
                    if (pollTimer.value) {
                        clearInterval(pollTimer.value);
                        pollTimer.value = null;
                    }
                    currentJobId.value = null;
                }

                function goToSearch() {
                    cancelPolling();
                    window.location.href = '/';
                }

                onMounted(() => {
                    const params = new URLSearchParams(window.location.search);
                    const jobId = params.get('job_id');

                    if (jobId) {
                        showReportShell();
                        pollResult(jobId, (data) => {
                            renderReport(data);
                        }, (error) => {
                            renderReportError(error);
                            console.error('Search error:', error);
                        });
                    } else if (params.get('view') === 'report' || window.location.hash === '#report') {
                        renderReportPreview();
                    } else {
                        // No job ID and no preview mode - redirect to search
                        window.location.href = '/';
                    }
                });

                return {
                    reportStatus,
                    reportContent,
                    showNewSearch,
                    stepClass,
                    goToSearch
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
