<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatentRAG - Novelty Search</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f5f8;
            --panel: #f0f0f5;
            --panel-border: #cac4d0;
            --surface: #ffffff;
            --surface-border: #d7d7dc;
            --text: #1d1d22;
            --muted: #8d8d96;
            --muted-strong: #6f7078;
            --accent: #111114;
            --accent-soft: #ededf0;
            --success: #217a3b;
            --success-bg: #e7f7ec;
            --warning: #9a5b00;
            --warning-bg: #fff2ce;
            --danger: #b12a3c;
            --danger-bg: #ffe7eb;
            --info: #315fbd;
            --info-bg: #eaf1ff;
            --shadow: 0 22px 60px rgba(20, 20, 35, 0.10);
            --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        * {
            margin: 0;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(20, 20, 35, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(20, 20, 35, 0.025) 1px, transparent 1px),
                var(--bg);
            background-size: 44px 44px;
            color: var(--text);
            font-family: var(--font);
            line-height: 1.5;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
        }

        .app {
            width: min(100%, 1180px);
            margin: 0 auto;
            padding: 28px 18px 56px;
        }

        .search-stage {
            min-height: clamp(520px, 76vh, 720px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(38px, 7vw, 74px);
            padding: clamp(34px, 8vw, 92px) clamp(16px, 8vw, 140px);
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.86), transparent 32%),
                var(--panel);
            border: 4px solid var(--panel-border);
            border-radius: 18px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
        }

        .brand-title {
            max-width: 100%;
            font-size: clamp(2rem, 5vw, 3.8rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: 0;
            text-align: center;
        }

        .composer {
            position: relative;
            width: min(100%, 820px);
            min-height: clamp(320px, 42vw, 380px);
            padding: clamp(26px, 4.6vw, 40px);
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: clamp(26px, 5vw, 42px);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .composer::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.96);
        }

        .textarea-wrap {
            position: relative;
            z-index: 1;
            flex: 1;
            min-height: 220px;
        }

        #documentText {
            width: 100%;
            height: 100%;
            min-height: 220px;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            font-size: clamp(1.1rem, 2.35vw, 1.65rem);
            line-height: 1.32;
            letter-spacing: 0;
        }

        .composer-actions {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 54px;
            padding-top: 22px;
        }

        .left-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .icon-btn {
            width: 52px;
            height: 52px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            color: var(--accent);
            background: transparent;
            cursor: pointer;
            transition: background 160ms ease, color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
        }

        .icon-btn:hover:not(:disabled),
        .icon-btn:focus-visible {
            background: var(--accent-soft);
            outline: none;
        }

        .icon-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .icon-btn svg {
            width: 28px;
            height: 28px;
            stroke-width: 1.8;
        }

        .submit-btn {
            background: #111114;
            color: #ffffff;
            box-shadow: 0 12px 32px rgba(17, 17, 20, 0.18);
        }

        .submit-btn:hover:not(:disabled),
        .submit-btn:focus-visible {
            background: #000000;
            box-shadow: 0 16px 34px rgba(17, 17, 20, 0.24);
        }

        .submit-btn:disabled {
            background: #e0e0e3;
            color: #b5b5ba;
            box-shadow: inset 0 0 0 2px #c6c6cb;
            cursor: not-allowed;
        }

        .file-name {
            min-width: 0;
            max-width: min(460px, 48vw);
            padding: 8px 12px;
            overflow: hidden;
            border: 1px solid #e2e2e7;
            border-radius: 999px;
            background: #f7f7fa;
            color: var(--muted-strong);
            font-size: 0.84rem;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #fileInput {
            display: none;
        }

        .clear-btn {
            width: 38px;
            height: 38px;
            color: var(--muted-strong);
        }

        .clear-btn svg {
            width: 20px;
            height: 20px;
        }

        .status-bar {
            width: min(100%, 820px);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.92rem;
            font-weight: 650;
        }

        .status-bar.info {
            background: var(--info-bg);
            color: var(--info);
        }

        .status-bar.success {
            background: var(--success-bg);
            color: var(--success);
        }

        .status-bar.error {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .spinner {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 999px;
            animation: spin 720ms linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 820px) {
            .app {
                padding: 12px 10px 36px;
            }

            .search-stage {
                min-height: calc(100vh - 24px);
                justify-content: flex-start;
                padding-top: 58px;
                border-width: 3px;
            }

            .composer {
                min-height: 360px;
            }

            .composer-actions {
                align-items: flex-end;
            }

            .file-name {
                max-width: 46vw;
            }
        }

        @media (max-width: 520px) {
            .search-stage {
                gap: 32px;
                padding-right: 12px;
                padding-left: 12px;
            }

            .composer {
                min-height: 410px;
                padding: 22px;
                border-radius: 28px;
            }

            #documentText {
                font-size: 1.1rem;
            }

            .icon-btn {
                width: 48px;
                height: 48px;
            }
        }
    </style>
</head>
<body>
    <main class="app" id="app">
        <section class="search-stage" aria-labelledby="pageTitle">
            <h1 class="brand-title" id="pageTitle">Novelty Search</h1>

            <form class="composer" id="searchForm" @submit.prevent="submitQuery" @dragover.prevent="onDragOver" @dragleave="onDragLeave" @drop.prevent="onDrop">
                <div class="textarea-wrap">
                    <textarea
                        id="documentText"
                        v-model="documentText"
                        aria-label="Technical solution"
                    ></textarea>
                </div>

                <div class="composer-actions">
                    <div class="left-actions">
                        <button class="icon-btn" type="button" aria-label="Upload text file" title="Upload text file" @click="triggerFileInput">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                                <path d="M12 16V4"></path>
                                <path d="m7 9 5-5 5 5"></path>
                                <path d="M5 20h14"></path>
                            </svg>
                        </button>
                        <button class="icon-btn clear-btn" type="button" aria-label="Clear text" title="Clear text" v-show="hasText || selectedFile" @click="clearAll">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                                <path d="M18 6 6 18"></path>
                                <path d="m6 6 12 12"></path>
                            </svg>
                        </button>
                        <div class="file-name" v-if="selectedFile">{{ fileName }}</div>
                        <input type="file" id="fileInput" accept=".txt,text/plain" @change="onFileChange" ref="fileInput">
                    </div>

                    <button class="icon-btn submit-btn" type="submit" :disabled="!hasText" aria-label="Search prior art" title="Search prior art">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                            <path d="M12 19V5"></path>
                            <path d="m5 12 7-7 7 7"></path>
                        </svg>
                    </button>
                </div>
            </form>

            <div class="status-bar" :class="status.type" v-if="status.visible" role="status" aria-live="polite">
                <span class="spinner" v-if="status.showSpinner"></span>
                <span>{{ status.message }}</span>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script>
        const { createApp, ref, computed } = Vue;

        createApp({
            setup() {
                const DEFAULT_EXAMPLE_TEXT = 'Example: A technical solution for reducing energy consumption in smart buildings uses a network of occupancy sensors, temperature sensors, and an intelligent control unit. The system continuously collects real-time environmental data and predicts room usage patterns through machine learning algorithms. Based on these predictions, it automatically adjusts lighting, heating, ventilation, and air-conditioning settings to match actual occupancy needs.';

                const documentText = ref(DEFAULT_EXAMPLE_TEXT);
                const selectedFile = ref(null);
                const fileName = ref('');
                const fileInput = ref(null);
                const status = ref({
                    visible: false,
                    message: '',
                    type: 'info',
                    showSpinner: false
                });
                const isSubmitting = ref(false);

                const hasText = computed(() => documentText.value.trim().length > 0);

                function showStatus(message, type = 'info', showSpinner = false) {
                    status.value = { visible: true, message, type, showSpinner };
                }

                function hideStatus() {
                    status.value.visible = false;
                }

                function handleFileSelection(file) {
                    const isTextFile = file.type === 'text/plain' || file.name.toLowerCase().endsWith('.txt');
                    if (!isTextFile) {
                        showStatus('Please select a .txt file.', 'error');
                        return;
                    }

                    selectedFile.value = file;
                    fileName.value = file.name;

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        documentText.value = event.target.result;
                    };
                    reader.onerror = () => {
                        showStatus('Failed to read file. Please try again.', 'error');
                    };
                    reader.readAsText(file);
                }

                function triggerFileInput() {
                    fileInput.value.click();
                }

                function onFileChange(event) {
                    const file = event.target.files[0];
                    if (file) {
                        handleFileSelection(file);
                    }
                }

                function onDragOver(event) {
                    event.currentTarget.style.borderColor = '#a9a3b8';
                }

                function onDragLeave(event) {
                    event.currentTarget.style.borderColor = '';
                }

                function onDrop(event) {
                    event.currentTarget.style.borderColor = '';
                    const file = event.dataTransfer.files[0];
                    if (file) {
                        handleFileSelection(file);
                    }
                }

                function clearAll() {
                    documentText.value = DEFAULT_EXAMPLE_TEXT;
                    selectedFile.value = null;
                    fileName.value = '';
                    if (fileInput.value) {
                        fileInput.value.value = '';
                    }
                    hideStatus();
                }

                async function submitQuery() {
                    const text = documentText.value.trim();
                    if (!text) {
                        showStatus('Please enter or upload a document first.', 'error');
                        return;
                    }

                    if (isSubmitting.value) return;
                    isSubmitting.value = true;
                    hideStatus();

                    try {
                        const response = await fetch('/api/query', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text })
                        });

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.error || `Server returned ${response.status}`);
                        }

                        const data = await response.json();
                        // Redirect to the report page with the job ID
                        window.location.href = `report.html?job_id=${encodeURIComponent(data.job_id)}`;
                    } catch (error) {
                        showStatus(error.message || 'Failed to submit query.', 'error');
                        isSubmitting.value = false;
                        console.error('Submit error:', error);
                    }
                }

                return {
                    documentText,
                    selectedFile,
                    fileName,
                    fileInput,
                    status,
                    hasText,
                    showStatus,
                    hideStatus,
                    triggerFileInput,
                    onFileChange,
                    onDragOver,
                    onDragLeave,
                    onDrop,
                    clearAll,
                    submitQuery
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
