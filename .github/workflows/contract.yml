name: API contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements.txt
      - run: npm test
        env:
          HASHTAG_API_KEY: ci-test-key
      - run: npm run build
